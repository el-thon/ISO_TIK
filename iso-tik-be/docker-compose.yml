services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/iso-tik-be-app:local
    container_name: iso-tik-be-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:Z
      - iso-tik-be-composer-cache:/tmp/cache:Z
    ports:
      - "8080:8080"
    environment:
      COMPOSER_CACHE_DIR: /tmp/cache
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -lc "composer install && php artisan migrate --seed --force && php artisan serve --host=0.0.0.0 --port=8080"

  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: iso-tik-be-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iso_tik_be_db
      POSTGRES_USER: iso_tik_be_user
      POSTGRES_PASSWORD: iso_tik_be_password
    ports:
      - "5433:5432"
    volumes:
      - iso-tik-be-postgres-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iso_tik_be_user -d iso_tik_be_db"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  iso-tik-be-postgres-data:
  iso-tik-be-composer-cache:
