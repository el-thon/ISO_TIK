openapi: 3.0.3
info:
  title: ISO TIK Backend API
  version: 1.0.0
  description: API documentation for ISO TIK Laravel backend. The API is compatible with the legacy ISO TIK frontend and uses custom Bearer tokens stored in auth.session_tokens.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development
  - url: https://api.example.com/api/v1
    description: Production placeholder
tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: Users
  - name: Admin Users
  - name: Admin Roles
  - name: Admin Settings
  - name: Admin Clauses
  - name: Topic Document Masters
  - name: Periods
  - name: Forums
  - name: Forum Participants
  - name: Topics
  - name: Input Items
  - name: Topic Workflow
  - name: Topic Versions
  - name: Attachments
  - name: Documents
  - name: Dashboard

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login/otp/resend:
    post:
      tags: [Auth]
      summary: Resend login OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                  example: admin@iso-tik.test
                email:
                  type: string
                  nullable: true
                username:
                  type: string
                  nullable: true
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users:
    get:
      tags: [Users]
      summary: Search users
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: role
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/{userId}/signature/download:
    get:
      tags: [Users]
      summary: Download user signature
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/FileDownload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /profile:
    get:
      tags: [Profile]
      summary: Get profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Profile]
      summary: Update profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /profile/employment:
    put:
      tags: [Profile]
      summary: Update employment profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmploymentRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'

  /profile/change-password:
    post:
      tags: [Profile]
      summary: Change password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'

  /profile/photo:
    post:
      tags: [Profile]
      summary: Upload profile photo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfilePhotoUploadRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Profile]
      summary: Delete profile photo
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /profile/sessions:
    get:
      tags: [Profile]
      summary: List profile sessions
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/PaginatedItems'

  /profile/sessions/{sessionId}:
    delete:
      tags: [Profile]
      summary: Revoke profile session
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'

  /profile/sessions/all:
    delete:
      tags: [Profile]
      summary: Revoke all other profile sessions
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /profile/login-history:
    get:
      tags: [Profile]
      summary: List profile login history
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/PaginatedItems'

  /profile/security/sessions:
    get:
      tags: [Profile]
      summary: List security sessions alias
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/PaginatedItems'
    delete:
      tags: [Profile]
      summary: Revoke all security sessions alias
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /profile/security/sessions/{sessionId}:
    delete:
      tags: [Profile]
      summary: Revoke security session alias
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /profile/security/login-history:
    get:
      tags: [Profile]
      summary: Security login history alias
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/PaginatedItems'

  /profile/signature:
    get:
      tags: [Profile]
      summary: Get current signature
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Signature metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Profile]
      summary: Upload signature
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignatureUploadRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Profile]
      summary: Delete signature
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /profile/signature/download:
    get:
      tags: [Profile]
      summary: Download current signature
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/FileDownload'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users:
    get:
      tags: [Admin Users]
      summary: List admin users
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema: { type: string }
        - name: role
          in: query
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/PaginatedItems'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin Users]
      summary: Create admin user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/users/statistics:
    get:
      tags: [Admin Users]
      summary: Admin user statistics
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/users/bulk-update-status:
    post:
      tags: [Admin Users]
      summary: Bulk update user status
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_ids:
                  type: array
                  items: { type: string }
                ids:
                  type: array
                  items: { type: string }
                status:
                  type: string
                  example: active
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{userId}:
    get:
      tags: [Admin Users]
      summary: Get admin user detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Admin Users]
      summary: Update admin user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Admin Users]
      summary: Delete admin user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{userId}/roles:
    get:
      tags: [Admin Users]
      summary: Get user roles
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/users/{userId}/assign-role:
    post:
      tags: [Admin Users]
      summary: Assign role to user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role_id: { type: string }
                role: { type: string, enum: [admin, product_owner, member] }
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{userId}/roles/{roleId}:
    delete:
      tags: [Admin Users]
      summary: Revoke user role
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/users/{userId}/activate:
    patch:
      tags: [Admin Users]
      summary: Activate user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/users/{userId}/deactivate:
    patch:
      tags: [Admin Users]
      summary: Deactivate user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/users/{userId}/reset-password:
    post:
      tags: [Admin Users]
      summary: Reset user password
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
                new_password: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/users/{userId}/restore:
    post:
      tags: [Admin Users]
      summary: Restore deleted user
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/users/{userId}/activity-logs:
    get:
      tags: [Admin Users]
      summary: Get user activity logs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedItems'

  /admin/rbac/roles:
    get:
      tags: [Admin Roles]
      summary: List global roles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolesResponse'

  /admin/system/settings:
    get:
      tags: [Admin Settings]
      summary: Get system settings
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
    put:
      tags: [Admin Settings]
      summary: Update system settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                settings:
                  type: object
                  additionalProperties: true
                security.login_otp.enabled:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/system/clauses:
    get:
      tags: [Admin Clauses]
      summary: List clauses
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: is_active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          $ref: '#/components/responses/PaginatedItems'
    post:
      tags: [Admin Clauses]
      summary: Create clause
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClauseRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/system/clauses/{clauseId}:
    put:
      tags: [Admin Clauses]
      summary: Update clause
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClauseId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClauseRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags: [Admin Clauses]
      summary: Delete clause
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClauseId'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/topic-document-masters:
    get:
      tags: [Topic Document Masters]
      summary: List topic document masters
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedItems'
    post:
      tags: [Topic Document Masters]
      summary: Create topic document master
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicDocumentMasterRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /admin/topic-document-masters/{id}:
    put:
      tags: [Topic Document Masters]
      summary: Update topic document master
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicDocumentMasterRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags: [Topic Document Masters]
      summary: Delete topic document master
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /topic-document-masters/active:
    get:
      tags: [Topic Document Masters]
      summary: Get active topic document master
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /period:
    get:
      tags: [Periods]
      summary: List periods
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: period_type
          in: query
          schema: { type: string }
        - name: is_active
          in: query
          schema: { type: boolean }
        - name: include_archived
          in: query
          schema: { type: boolean }
      responses:
        '200':
          $ref: '#/components/responses/PaginatedItems'
    post:
      tags: [Periods]
      summary: Create period
      description: Admin only. Legacy period_type audit is mapped to custom.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'

  /period/join:
    post:
      tags: [Periods]
      summary: Join period
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                join_code: { type: string }
                code: { type: string }
                period_id: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /period/{periodId}:
    get:
      tags: [Periods]
      summary: Get period detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Periods]
      summary: Update period
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '403':
          $ref: '#/components/responses/Forbidden'

  /period/{periodId}/join-requests:
    get:
      tags: [Periods]
      summary: List period join requests
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedItems'

  /period/{periodId}/join-requests/{joinRequestId}/approve:
    post:
      tags: [Periods]
      summary: Approve period join request
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - name: joinRequestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /period/{periodId}/forums:
    get:
      tags: [Forums]
      summary: List forums by period
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedItems'
    post:
      tags: [Forums]
      summary: Create forum by period
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PeriodId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForumRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /forums:
    get:
      tags: [Forums]
      summary: List forums
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: period_id
          in: query
          schema: { type: string }
        - name: include_archived
          in: query
          schema: { type: boolean }
      responses:
        '200':
