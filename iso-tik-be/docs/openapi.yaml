components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    Search:
      name: search
      in: query
      schema: { type: string }
      description: Search term. Some endpoints also accept q or keyword.
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    ClauseId:
      name: clauseId
      in: path
      required: true
      schema: { type: string }
    PeriodId:
      name: periodId
      in: path
      required: true
      schema: { type: string }
    RoomId:
      name: roomId
      in: path
      required: true
      schema: { type: string }
    ForumId:
      name: forumId
      in: path
      required: true
      schema: { type: string }
    ParticipantId:
      name: participantId
      in: path
      required: true
      schema: { type: string }
    TopicId:
      name: topicId
      in: path
      required: true
      schema: { type: string }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string }

  responses:
    Success:
      description: Success response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardResponse'
    PaginatedItems:
      description: Paginated list response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedItemsResponse'
    WorkflowSuccess:
      description: Workflow action response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkflowResponse'
    FileDownload:
      description: File download
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  requestBodies:
    LoginRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginRequest'
    RefreshTokenRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              refresh_token: { type: string }
              refreshToken: { type: string }
    PeriodStoreRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PeriodRequest'
    ForumStoreRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForumRequest'
    TopicStoreRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TopicRequest'
    InputItemStoreRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InputItemRequest'
    DocumentStoreRequest:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/DocumentStoreRequest'
    AttachmentStoreRequest:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/AttachmentUploadRequest'

  schemas:
    StandardResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object
          nullable: true
          additionalProperties: true

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
        from:
          type: integer
          nullable: true
        to:
          type: integer
          nullable: true

    PaginatedItemsResponse:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            items:
              type: array
              items: { type: object }
            meta:
              $ref: '#/components/schemas/PaginationMeta'
            pagination:
              $ref: '#/components/schemas/PaginationMeta'

    PaginatedUsersResponse:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            data:
              type: object
              properties:
                users:
                  type: array
                  items:
                    $ref: '#/components/schemas/User'
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/User'
                meta:
                  $ref: '#/components/schemas/PaginationMeta'
                pagination:
                  $ref: '#/components/schemas/PaginationMeta'
            users:
              type: array
              items:
                $ref: '#/components/schemas/User'
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'
            meta:
              $ref: '#/components/schemas/PaginationMeta'
            pagination:
              $ref: '#/components/schemas/PaginationMeta'

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          example: admin@iso-tik.test
        email:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        password:
          type: string
          format: password
          example: password
        otp:
          type: string
          nullable: true

    AuthTokenResponse:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            token: { type: string }
            token_type: { type: string, example: Bearer }
            user:
              $ref: '#/components/schemas/User'
            roles:
              type: array
              items: { type: string }

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        username:
          type: string
          nullable: true
        status: { type: string }
        roles:
          type: array
          items: { type: string }

    UserResponse:
      allOf:
        - $ref: '#/components/schemas/StandardResponse'
        - type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            roles:
              type: array
              items: { type: string }

    Role:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        display_name:
          type: string
          nullable: true

    RolesResponse:
      allOf:
