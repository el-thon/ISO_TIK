version: '3.9'

services:
  iso-tik-fe:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
        VITE_STORAGE_BASE_URL: http://localhost:8080
    image: iso-tik-fe:latest
    container_name: iso-tik-fe-prod
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
